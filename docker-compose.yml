name: docquery

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DB_PATH: /app/data/chat.db
    volumes:
      - uploads:/app/uploads
      - faiss_indexes:/app/faiss_indexes
      - database:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"

volumes:
  uploads:
  faiss_indexes:
  database: